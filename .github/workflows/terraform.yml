name: terraform

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "src/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "src/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  # OIDC: no client secret is stored in the repository. The federated credential
  # is configured once on the app registration, scoped to this repo.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  static-analysis:
    name: fmt / validate / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: Validate the bootstrap root module
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate -no-color

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: tflint --init && tflint --recursive --format compact

  plan:
    name: plan (${{ matrix.environment }})
    needs: static-analysis
    runs-on: ubuntu-latest
    # Only attempt a real plan on PRs, and only when the Azure wiring is present.
    # A fork's PR never sees these variables, so the job is skipped rather than
    # failing on an authentication error nobody can fix from the PR.
    if: >-
      github.event_name == 'pull_request' &&
      vars.AZURE_CLIENT_ID != '' &&
      vars.TF_STATE_STORAGE_ACCOUNT != ''
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # The backend config is gitignored (it names a real storage account), so it
      # is rendered here from repository variables instead of being committed.
      - name: Render backend config
        run: |
          cat > envs/${{ matrix.environment }}.backend.hcl <<EOF
          resource_group_name  = "${{ vars.TF_STATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TF_STATE_CONTAINER }}"
          key                  = "sbarch/${{ matrix.environment }}/terraform.tfstate"
          use_azuread_auth     = true
          EOF

      - name: terraform init
        run: terraform init -backend-config=envs/${{ matrix.environment }}.backend.hcl -input=false

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color -out=tfplan \
            -var-file=envs/${{ matrix.environment }}.tfvars
          terraform show -no-color tfplan > plan.txt

      - name: Comment the plan on the pull request
        if: always()
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('plan.txt')
              ? fs.readFileSync('plan.txt', 'utf8')
              : 'Plan did not produce output — see the job log.';
            const body = raw.length > 60000 ? `${raw.slice(0, 60000)}\n... (truncated)` : raw;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `#### Terraform plan — \`${process.env.ENVIRONMENT}\``,
                '<details><summary>Show plan</summary>',
                '',
                '```terraform',
                body,
                '```',
                '',
                '</details>',
              ].join('\n'),
            });
